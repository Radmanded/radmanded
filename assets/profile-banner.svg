<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Ruben Dedman — Enterprise AI Solutions Architect and Application Builder</title>
  <desc id="desc">Editorial banner with connected workflow nodes representing operational friction becoming working software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#111E2E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C46845"/>
      <stop offset="1" stop-color="#1B5E54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 310 C240 250 390 390 630 304 C845 227 1005 288 1280 210 L1280 360 L0 360 Z" fill="#FFF8F0" opacity="0.035"/>
  <circle cx="1115" cy="55" r="165" fill="#1B5E54" opacity="0.16"/>
  <circle cx="1230" cy="310" r="120" fill="#C46845" opacity="0.13"/>

  <g transform="translate(68 72)">
    <text x="0" y="0" fill="#D4A853" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.6">ENTERPRISE AI SOLUTIONS ARCHITECT · APPLICATION BUILDER</text>
    <text x="0" y="82" fill="#FFF8F0" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="1">RUBEN DEDMAN</text>
    <rect x="0" y="108" width="94" height="4" rx="2" fill="#C46845"/>
    <text x="0" y="160" fill="#FFF8F0" opacity="0.88" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500">Turn operational friction into working software.</text>
    <text x="0" y="205" fill="#FFF8F0" opacity="0.58" font-family="'Courier New', monospace" font-size="15">WORKFLOWS  /  APPLICATIONS  /  API INTEGRATION  /  DECISION SYSTEMS  /  NETWORK AUTOMATION</text>
  </g>

  <g transform="translate(865 88)" filter="url(#shadow)">
    <path d="M36 40 H126 M126 40 C163 40 163 95 200 95 H268 M126 40 C163 40 163 148 200 148 H268 M36 202 H126 C163 202 163 148 200 148" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>

    <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">
      <rect x="0" y="18" width="84" height="44" rx="12" fill="#FFF8F0"/>
      <text x="19" y="45" fill="#0A1220">INBOX</text>

      <rect x="0" y="180" width="84" height="44" rx="12" fill="#FFF8F0"/>
      <text x="10" y="207" fill="#0A1220">PORTAL</text>

      <rect x="98" y="18" width="94" height="44" rx="12" fill="#C46845"/>
      <text x="116" y="45" fill="#FFF8F0">WORKFLOW</text>

      <rect x="196" y="73" width="104" height="44" rx="12" fill="#1B5E54"/>
      <text x="221" y="100" fill="#FFF8F0">RULES</text>

      <rect x="196" y="126" width="104" height="44" rx="12" fill="#D4A853"/>
      <text x="223" y="153" fill="#0A1220">AI HELP</text>

      <rect x="294" y="96" width="112" height="72" rx="16" fill="#FFF8F0"/>
      <text x="316" y="127" fill="#0A1220">WORKING</text>
      <text x="319" y="147" fill="#0A1220">SYSTEM</text>
    </g>

    <circle cx="126" cy="40" r="6" fill="#D4A853"/>
    <circle cx="200" cy="95" r="6" fill="#C46845"/>
    <circle cx="200" cy="148" r="6" fill="#1B5E54"/>
  </g>
</svg>
